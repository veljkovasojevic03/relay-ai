name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Official image, pinned. Scans the full history on every run (the repo is small), which
      # avoids gitleaks-action's commit-range edge cases on first pushes and force pushes.
      - name: Scan full git history
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Database: a disposable local Supabase stack with every migration applied.
      - name: Start local Supabase
        run: pnpm db:start
      - run: pnpm db:lint
      - name: Generated DB types are up to date
        run: pnpm db:types && git diff --exit-code -- src/lib/supabase/database.types.ts
      - run: pnpm test:db

      # The app is built and tested against that local stack, never the cloud project.
      - name: Build (local Supabase env)
        run: node scripts/local-supabase.mjs -- pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (local Supabase env)
        run: node scripts/local-supabase.mjs -- pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
