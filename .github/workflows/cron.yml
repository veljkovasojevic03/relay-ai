name: Cron tick

# Calls POST /api/cron/tick on the deployed app: Supabase keep-alive now, plus outbox
# retries, counter resets and data purging as later phases add them.
# Note: GitHub may delay scheduled runs by many minutes or skip them under load, so nothing
# may depend on exact timing. Free Supabase pauses after 7 idle days; hourly is far inside that.

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour when GitHub's queue is busiest
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST "${APP_URL%/}/api/cron/tick" \
            -H "Authorization: Bearer ${CRON_SECRET}"
